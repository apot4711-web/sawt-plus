name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp apk/*.apk release/sawt-plus.apk
          cp bin/sawt-linux-amd64 release/sawt-linux-amd64
          git archive --format=zip --prefix="sawt-plus-${version}/" \
            -o release/sawt-plus-source.zip HEAD -- . \
            ':(exclude)apk' ':(exclude)bin' ':(exclude)SHA256SUMS'
          (cd release && sha256sum sawt-plus.apk sawt-linux-amd64 sawt-plus-source.zip > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          if [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ]; then
            notes_args=(--notes-file "docs/release-notes/${GITHUB_REF_NAME}.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/sawt-plus.apk \
            release/sawt-linux-amd64 \
            release/sawt-plus-source.zip \
            release/SHA256SUMS \
            --title "Sawt+ ${GITHUB_REF_NAME#v}" \
            "${notes_args[@]}"
